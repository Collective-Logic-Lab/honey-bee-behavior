[project]
name = "hive-video"
version = "0.1.0"
description = "Analysis tools and notebooks for Collective Logic Lab honey bee video data."
requires-python = ">=3.11"
dependencies = [
    "hf>=1.14.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
