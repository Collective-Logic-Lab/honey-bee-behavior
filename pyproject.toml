[project]
name = "honey-bee-behavior"
version = "0.1.0"
description = "Analysis tools and notebooks for Collective Logic Lab honey bee behavior data."
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "tables>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
